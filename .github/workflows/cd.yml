name: iris-cd

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build and Push Docker image
        run: |
          docker build -t us-central1-docker.pkg.dev/mindful-girder-487814-j2/iris-repo/iris-api:${{ github.sha }} .
          docker push us-central1-docker.pkg.dev/mindful-girder-487814-j2/iris-repo/iris-api:${{ github.sha }}

      - name: Get GKE credentials
        run: |
          gcloud container clusters get-credentials iris-cluster --zone=us-central1-a

      - name: Deploy to GKE
        run: |
          kubectl set image deployment/iris-api iris-api=us-central1-docker.pkg.dev/mindful-girder-487814-j2/iris-repo/iris-api:${{ github.sha }}
          kubectl rollout status deployment/iris-api
