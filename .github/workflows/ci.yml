name: iris-ci

on:
  push:
  pull_request:

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install dvc[gs] scikit-learn pandas numpy pytest joblib

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}

      - name: Pull data and model via DVC
        run: dvc pull --force

      - name: Run tests
        run: |
          pytest tests/ -v 2>&1 | tee pytest_output.txt
        continue-on-error: true

      - name: Set up CML
        uses: iterative/setup-cml@v2

      - name: Post CML report
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "## CI Test Results" > report.md
          echo '```' >> report.md
          cat pytest_output.txt >> report.md
          echo '```' >> report.md
          cml comment create report.md
